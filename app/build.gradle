plugins {
    id 'com.android.application'
}

android {
    namespace 'com.decom.escaner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.decom.escaner'
        minSdk 29
        targetSdk 34
        versionCode 3
        versionName '3.0'
    }

    // Firma fija: GitHub crea una llave nueva en cada compilación, y Android no deja
    // actualizar una app firmada con otra llave. Con esta, todas las versiones coinciden.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'js', 'mjs'
    }
}

dependencies {
    // FileProvider: para que la cámara guarde la foto y para compartir archivos
    implementation 'androidx.core:core:1.13.1'

    // Escáner de documentos de Google (detección con IA, captura automática, recorte)
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'

    // Alinea las versiones de Kotlin que traen las librerías (evita clases duplicadas)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
